<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>trialviz API reference</title>
  <meta name="description" content="Reference for the trialviz API: endpoints, request and response schemas, examples and errors.">
  <meta name="color-scheme" content="light">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%231f5fbf'/%3E%3Cpath d='M5 17h6l2.5-6 4 11 3-8 1.5 3H27' fill='none' stroke='white' stroke-width='2.4' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,600&display=swap" rel="stylesheet">
  <style>
    :root { --scalar-custom-header-height: 57px; }
    body { margin: 0; font-family: "Inter", system-ui, sans-serif; background: #ffffff; }
    .api-header {
      position: sticky; top: 0; z-index: 100; height: 57px; box-sizing: border-box;
      display: flex; align-items: center; justify-content: space-between; gap: 16px;
      padding: 0 24px; background: rgba(255, 255, 255, 0.92); backdrop-filter: blur(10px);
      border-bottom: 1px solid #e2e8f0;
    }
    .api-brand { display: inline-flex; align-items: center; gap: 10px; color: #0f1d33; text-decoration: none; font-family: "Source Serif 4", Georgia, serif; font-weight: 600; font-size: 20px; }
    .api-brand-mark { width: 30px; height: 30px; border-radius: 8px; background: #1f5fbf; display: grid; place-items: center; }
    .api-brand small { font-family: "Inter", sans-serif; font-weight: 500; font-size: 13px; color: #5d6a80; padding: 2px 8px; border: 1px solid #e2e8f0; border-radius: 999px; }
    .api-nav { display: flex; gap: 4px; }
    .api-nav a { color: #33415a; text-decoration: none; font-size: 15px; font-weight: 500; padding: 7px 12px; border-radius: 8px; }
    .api-nav a:hover { background: #f2f7fe; color: #174a96; }
    .api-nav a:focus-visible { outline: 3px solid #1f5fbf; outline-offset: 2px; }
    @media (max-width: 640px) { .api-nav a:last-child, .api-brand small { display: none; } }
  </style>
</head>
<body>
  <header class="api-header">
    <a class="api-brand" href="/">
      <span class="api-brand-mark" aria-hidden="true">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12.5h4l2-4.5 3.2 9 2.4-6.5 1.4 2H21"/></svg>
      </span>
      trialviz <small>API reference</small>
    </a>
    <nav class="api-nav" aria-label="Main">
      <a href="/">Ask</a>
      <a href="/samples">Samples</a>
      <a href="https://github.com/srivatsav-kannan/trialviz" rel="noopener">GitHub</a>
    </nav>
  </header>

  <div id="reference"></div>

  <script src="https://cdn.jsdelivr.net/npm/@scalar/api-reference@1.72.4/dist/browser/standalone.js"></script>
  <script>
    // The reference renders the service's own OpenAPI document, so it always matches the code.
    Scalar.createApiReference("#reference", {
      url: "/openapi.json",
      layout: "modern",
      theme: "none",
      darkMode: false,
      forceDarkModeState: "light",
      hideDarkModeToggle: true,
      withDefaultFonts: false,
      defaultHttpClient: { targetKey: "shell", clientKey: "curl" },
      // Scalar's hosted AI chat, MCP generator and developer tools call Scalar's own
      // services, which a local reference has no business doing.
      agent: { disabled: true },
      mcp: { disabled: true },
      showDeveloperTools: "never",
      // The reference documents the API; requests are sent with curl or a client of the
      // reader's own, so Scalar's built-in request client is turned off.
      hideClientButton: true,
      hideTestRequestButton: true,
      metaData: { title: "trialviz API reference" },
      customCss: `
        .light-mode, .scalar-app {
          --scalar-font: "Inter", system-ui, sans-serif;
          --scalar-font-code: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
          --scalar-color-1: #0f1d33;
          --scalar-color-2: #33415a;
          --scalar-color-3: #5d6a80;
          --scalar-color-accent: #1f5fbf;
          --scalar-background-1: #ffffff;
          --scalar-background-2: #f7f9fc;
          --scalar-background-3: #eef2f8;
          --scalar-background-accent: #e9f1fc;
          --scalar-border-color: #e2e8f0;
          --scalar-color-green: #13804f;
          --scalar-color-blue: #1f5fbf;
          --scalar-color-orange: #c2561f;
          --scalar-color-red: #c63b3b;
          --scalar-color-purple: #5b46c9;
          --scalar-color-yellow: #946300;
          --scalar-radius: 8px;
          --scalar-radius-lg: 12px;
        }
        .scalar-app h1, .scalar-app .section-header { font-family: "Source Serif 4", Georgia, serif; letter-spacing: -0.01em; }
      `,
    });
  </script>
</body>
</html>
