[project]
name = "trialviz"
version = "0.1.0"
description = "Turns questions about clinical trials into visualization specs backed by ClinicalTrials.gov, with citations to the source records."
authors = [
    { name = "Srivatsav Kannan", email = "srivatsavkannan@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "anthropic>=2.6",
    "fastapi>=0.115",
    "httpx>=0.28",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "uvicorn[standard]>=0.32",
]

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "hypothesis>=6.115",
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra --strict-markers"
markers = [
    "live: calls real external services (Anthropic, ClinicalTrials.gov); run with --run-live",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]

[tool.ruff.lint.per-file-ignores]
# Registry country names contain typographic apostrophes ("Côte d’Ivoire") by design.
"src/trialviz/vocabulary/countries.py" = ["RUF001"]
"src/trialviz/vocabulary/_parsing.py" = ["RUF002"]
"src/trialviz/visualization/geo.py" = ["RUF001", "RUF002"]
# Tests feed real-world punctuation (curly apostrophes, en dashes) on purpose.
"tests/**" = ["RUF001"]
